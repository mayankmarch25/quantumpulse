<div class="fig" data-fig="amplitude" style="margin:12px 0 0">
<div class="slider">
<label>amplitude a <output data-role="out">0.60</output></label>
<input type="range" data-role="range" min="-1" max="1" value="{{ include.a | default: 0.6 }}" step="0.05" aria-label="Amplitude a">
</div>
<div class="bars" style="margin-top:12px">
<div class="bar"><span>0</span><div class="track"><div class="fill" data-role="b0"></div></div><span class="val" data-role="v0">–</span></div>
<div class="bar one"><span>1</span><div class="track"><div class="fill" data-role="b1"></div></div><span class="val" data-role="v1">–</span></div>
</div>
<p class="readout">b = √(1 − a²) = <b data-role="b">–</b> · a² = <b data-role="a2">–</b> · b² = <b data-role="b2">–</b> · sum = <b>1</b></p>
{% if include.caption %}<p class="fig-cap">{{ include.caption }}</p>{% endif %}
</div>
