<div class="fig" data-fig="compare">
<div class="fig-head"><b>FIGURE {{ include.num }}</b><span>{{ include.title }}</span></div>
<div class="compare">
<div class="panel">
<h4>COIN · SHUFFLE TWICE</h4>
<div class="coin" data-role="coin" style="width:72px;height:72px;font-size:26px">?</div>
<div class="bars" style="margin-top:12px">
<div class="bar gold"><span>H</span><div class="track"><div class="fill" data-role="ch" style="width:0%"></div></div><span class="val" data-role="chv">–</span></div>
<div class="bar"><span>T</span><div class="track"><div class="fill" data-role="ct" style="width:0%"></div></div><span class="val" data-role="ctv">–</span></div>
</div>
<p class="step-lbl" data-role="lblc">before: unflipped</p>
</div>
<div class="panel">
<h4>QUBIT · QUARTER TURN TWICE</h4>
<div data-role="stage" style="max-width:170px;margin:0 auto"></div>
<div class="bars" style="margin-top:4px">
<div class="bar"><span>0</span><div class="track"><div class="fill" data-role="qa" style="width:100%"></div></div><span class="val" data-role="qav">100%</span></div>
<div class="bar one"><span>1</span><div class="track"><div class="fill" data-role="qb" style="width:0%"></div></div><span class="val" data-role="qbv">0%</span></div>
</div>
<p class="step-lbl" data-role="lblq">before: pointing to 0</p>
</div>
</div>
<div class="ctrl" style="margin-top:16px">
<button class="btn primary" type="button" data-act="run">Run both, twice</button>
<button class="btn" type="button" data-act="reset">Reset</button>
</div>
{% if include.caption %}<p class="fig-cap">{{ include.caption }}</p>{% endif %}
</div>
